# Render Blueprint - creates the web service + a managed Postgres database.
# In Render: New -> Blueprint -> pick this repo. Then set APP_PASSWORD in the
# web service's Environment tab. (SECRET_KEY is generated; DATABASE_URL is wired
# automatically from the database below.)
databases:
  - name: abacus-db
    plan: basic-256mb        # upgraded from free in the dashboard; a sync may not downgrade it
    region: frankfurt

services:
  # Live at insiderpro-process.onrender.com. It replaced the original abacus-tracker
  # service (Sep 2026) only to change the address: a service's onrender.com name is
  # fixed when it is created. Same database, so the data never moved.
  - type: web
    name: insiderpro-process
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abacus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false          # set this yourself in the Render dashboard
      # Jira (read-only story points). JIRA_API_TOKEN is a secret set by hand.
      - key: JIRA_BASE_URL
        value: "https://insiderpro.atlassian.net"
      - key: JIRA_EMAIL
        value: "team@insiderpro.co.uk"
      - key: JIRA_API_TOKEN
        sync: false          # set this yourself in the Render dashboard (read-only token)
      # Jamie (meeting notes). A secret set by hand; the code has no fallback key.
      - key: JAMIE_API_KEY
        sync: false          # set this yourself in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.6"
