<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if is_test %}[TEST] {% endif %}Insider Pro · Abacus</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='ip-logo.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ static_v('style.css') }}" />
</head>
<body>
  {% include '_test_banner.html' %}
  {% set nav_active = "abacus" %}{% include '_nav.html' %}

  <!-- Top bar: shared by every page (templates/_topbar.html), so the logo never moves. -->
  {% from '_topbar.html' import brand %}
  <div class="ip-top">
    <div class="ip-top-inner">
      {{ brand("Abacus", "Work package tracker") }}
      <div class="ip-top-spacer"></div>
      <span id="sync" class="sync"></span>
      <div class="control-actions">
        <button class="linkbtn sync-all-jira" id="sync-all-jira" title="Review and apply Jira status changes across all pushed work packages">⟳ Sync all pushed items from Jira</button>
        <a class="linkbtn" href="/admin/settings" title="Settings: edit the 12 steps, refresh from Jira, sign out">⚙ Settings</a>
      </div>
    </div>
  </div>

  <main class="wrap">
    <section class="controls">
      <div class="filters" id="filters">
        <button class="chip active" data-filter="Active">Active</button>
        <button class="chip" data-filter="Inactive">Inactive</button>
      </div>
      <div class="legend">
        <span><i class="sw done"></i>Complete</span>
        <span><i class="sw progress"></i>In progress</span>
        <span><i class="sw todo"></i>Outstanding</span>
        <span><i class="sw na"></i>Not started</span>
        <span><i class="sw nr"></i>Not required</span>
      </div>
    </section>

    <div id="status" class="status"></div>
    <div id="jira-sync-notice" class="sync-notice" hidden></div>

    <!-- Summary matrix (expanded detail panels render inline below each row) -->
    <section class="card">
      <div class="matrix-wrap">
        <table class="matrix" id="matrix">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="{{ static_v('app.js') }}"></script>
</body>
</html>
