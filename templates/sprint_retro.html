/* The notes for a week. A week with nothing saved yet starts blank, held in memory and
   never written until somebody edits it. Last sprint's unfinished goals no longer copy
   across by themselves (Sam, 5 Oct 2026): the Pull button brings them over. */
function weekEntry(weekStart){
  if (!NOTES.weeks[weekStart]) NOTES.weeks[weekStart] = { projects:{} };
  return NOTES.weeks[weekStart];
}

/* ===================================================== pull last sprint's unfinished goals */

const hasGoals = (entry) => Object.values((entry || {}).projects || {}).some((p) => asGoals((p || {}).next).length);

/* Where the Pull button takes goals from: the latest earlier week with any goals in it.
   Usually last week; further back when last week was never written in. */
function pullSourceWeek(weekStart){
  return Object.keys(NOTES.weeks).filter((k) => k < weekStart && hasGoals(NOTES.weeks[k])).sort().pop() || null;
}

/* Which row a notes key belongs on, or null when the page has no card for it (the old
   project-level ISPMKTG / ISPOPS2 priorities, say). Customers left out by the Customers
   picker count as no card, so the button never pulls goals nobody can see. */
function cardRow(code){
  if (allCustomers().has(code)) return (!PINNED.size || PINNED.has(code)) ? "Customer" : null;
  const e = allEpics().get(code);
  return e ? e.sector : null;
}

/* {code: [goals]} for this week: last sprint's goals not ticked green and not already here.
   `left` counts what stays behind and why, so the button can say. */
function pullableGoals(){
  const w = DATA.weeks[weekIdx];
  const src = pullSourceWeek(w.start);
  const out = { src, codes:{}, count:0, left:{ green:0, here:0, hidden:0 } };
  if (!src) return out;
  const here = (NOTES.weeks[w.start] || {}).projects || {};
  Object.entries(NOTES.weeks[src].projects || {}).forEach(([code, p]) => {
    const all = asGoals((p || {}).next);
    if (!cardRow(code)){
      if (allCustomers().has(code)) out.left.hidden += all.length;   // left out by the picker
      return;
    }
    const finished = new Set(asGoals((p || {}).done));
    const have = new Set(asGoals((here[code] || {}).next));
    const goals = all.filter((g) => {
      if (finished.has(g)){ out.left.green++; return false; }
      if (have.has(g)){ out.left.here++; return false; }
      return true;
    });
    if (goals.length){ out.codes[code] = goals; out.count += goals.length; }
  });
  return out;
}

/* Always on show. With nothing to pull it greys out and says why, rather than vanishing. */
function renderPullBtn(){
  const btn = $("pullBtn");
  const pull = pullableGoals();
  const w = DATA.weeks[weekIdx];
  btn.hidden = false;
  btn.disabled = !pull.count;
  if (!pull.src){
    btn.textContent = "↻ No goals in earlier sprints to pull";
    btn.title = "Goals pulled across come from the last sprint with any goals written in it, and there is none before this one.";
    return;
  }
  const lastWeek = pull.src === isoAdd(w.start, -7);
  const from = lastWeek ? "last sprint" : "w/c " + fmtDate(pull.src);
  const srcWeek = DATA.weeks.find((x) => x.start === pull.src);
  const srcName = srcWeek ? sprintTitle(srcWeek) : "w/c " + fmtDate(pull.src);
  const n = (k, one, many) => k + " " + (k === 1 ? one : many);
  const why = [
    pull.left.green  ? n(pull.left.green, "goal is ticked green", "goals are ticked green") : "",
    pull.left.here   ? n(pull.left.here, "goal is already in this sprint", "goals are already in this sprint") : "",
    pull.left.hidden ? n(pull.left.hidden, "goal is on a customer not ticked in Customers", "goals are on customers not ticked in Customers") : ""
  ].filter(Boolean);
  if (!pull.count){
    btn.textContent = "✓ Nothing left to pull from " + from;
    btn.title = "From " + srcName + ": " + (why.length ? why.join(", ") : "no goals on any card shown here") + ".";
    return;
  }
  btn.textContent = "↻ Pull " + n(pull.count, "unfinished goal", "unfinished goals") + " from " + from;
  btn.title = "Goals from " + srcName + " that were not ticked green. Ticked ones stay behind." +
    (why.length ? " Left behind: " + why.join(", ") + "." : "");
}

function pullGoals(){
  const pull = pullableGoals();
  if (!pull.count) return;
  Object.entries(pull.codes).forEach(([code, goals]) => {
    const cur = noteFor(code);
    cur.next = asGoals(cur.next).concat(goals);
  });
  queueSave();
  renderProjects();
  flash("Pulled " + pull.count + " unfinished " + (pull.count === 1 ? "goal" : "goals") + " into this sprint.", "info");
}

/* ===================================================== goal bullet lists */

/* Goals are stored as an array of strings. Older notes held one newline-separated string,
   so accept both. */
function asGoals(v){
  if (Array.isArray(v)) return v.filter((x) => String(x).trim());
  return String(v || "").split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
}

function growTextarea(t){
  t.style.height = "auto";
  t.style.height = Math.max(18, t.scrollHeight) + "px";
}

/* Fills `ul` with one editable bullet per goal, plus a blank one to type into.
   Enter starts a new bullet, Backspace on an empty one removes it, and every bullet
   grows to fit. Each bullet's tick circle marks it done (the goals in `done`, a Set of
   goal texts). onChange gets the non-empty goals back, then the ticked ones. */
function buildGoalList(ul, goals, done, placeholder, onChange){
  ul.innerHTML = "";

  const commit = () => {
    const kept = [...ul.children]
      .map((li) => ({ text:li.querySelector("textarea").value.trim(), done:li.classList.contains("done") }))
      .filter((g) => g.text);
    onChange(kept.map((g) => g.text), kept.filter((g) => g.done).map((g) => g.text));
  };

  const ensureBlank = () => {
    const last = ul.lastElementChild;
    if (!last || last.querySelector("textarea").value.trim()) addRow("", false, false);
  };

  function addRow(text, focus, isDone){
    const li = document.createElement("li");
    li.innerHTML = '<button class="gtick" type="button"></button>' +
                   '<textarea rows="1"></textarea>' +
                   '<button class="gx no-print" title="Remove" tabindex="-1">&times;</button>';
    const ta = li.querySelector("textarea");
    const tick = li.querySelector(".gtick");
    ta.value = text || "";
    ta.placeholder = placeholder;

    const setDone = (on) => {
      li.classList.toggle("done", on);
      tick.setAttribute("aria-pressed", String(on));
      tick.title = on ? "Done. Click to mark it not done" : "Mark as done";
      tick.setAttribute("aria-label", tick.title);
    };
    /* A blank bullet has nothing to tick, and emptying a ticked one clears its tick. */
    const setEmpty = () => {
      const empty = !ta.value.trim();
      li.classList.toggle("empty", empty);
      tick.disabled = empty;
      if (empty && li.classList.contains("done")) setDone(false);
    };
    setDone(!!isDone);
    setEmpty();
    tick.onclick = () => {
      const on = !li.classList.contains("done");
      setDone(on);
      commit();
      if (on) celebrateIfAllDone(ul);
    };

    ta.addEventListener("input", () => {
      growTextarea(ta);
      setEmpty();
      ensureBlank();
      commit();
    });
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){
        e.preventDefault();
        const next = li.nextElementSibling;
        if (next && !next.querySelector("textarea").value.trim()){
          next.querySelector("textarea").focus();
        } else {
          const row = addRow("", true, false);
          ul.insertBefore(row, li.nextSibling);
          row.querySelector("textarea").focus();
        }
      } else if (e.key === "Backspace" && !ta.value && ul.children.length > 1){
        e.preventDefault();
        const prev = li.previousElementSibling;
        li.remove();
        if (prev){
          const pt = prev.querySelector("textarea");
          pt.focus(); pt.setSelectionRange(pt.value.length, pt.value.length);
        }
        ensureBlank(); commit();
      }
    });
    li.querySelector(".gx").onclick = () => { li.remove(); ensureBlank(); commit(); };

    ul.appendChild(li);
    growTextarea(ta);
    if (focus) ta.focus();
    return li;
  }

  goals.forEach((g) => addRow(g, false, done.has(g)));
  addRow("", false, false);                        // always one blank to type into
  requestAnimationFrame(() => ul.querySelectorAll("textarea").forEach(growTextarea));
}

/* ===================================================== all goals ticked: party */

/* A bit of fun (Sam, 6 Oct 2026): ticking the last open "Next sprint goal" on a card
   sets off ten seconds of fireworks and dancing, with sound. It was the last goal on the
   whole page at first, which hardly ever happens, so Sam moved it to each card. Only the
   tick that finishes a card does it, so opening a week whose goals are green stays quiet. */
function celebrateIfAllDone(ul){
  const goals = [...ul.querySelectorAll("li:not(.empty)")];
  if (goals.length && goals.every((li) => li.classList.contains("done"))){
    const name = ul.closest(".proj")?.querySelector("h3 .name")?.textContent.trim();
    celebrate(name);
  }
}

const PARTY_MS = 10000;

function celebrate(name){
  if (document.querySelector(".party")) return;
  const dancers = [["🕺","groove"], ["💃","shimmy"], ["🎉","twirl"], ["🕺","shimmy",1],
                   ["💃","groove",1], ["🥳","twirl"], ["🕺","groove"]];
  const el = document.createElement("div");
  el.className = "party no-print";
  el.setAttribute("role", "status");
  el.innerHTML = '<div class="party-beams"></div><canvas></canvas>' +
    '<div class="party-ball"><span>🪩</span></div>' +
    '<div class="party-hint">Click anywhere to close</div>' +
    '<div class="party-msg"><div class="party-big">Every goal ticked!</div>' +
      '<div class="party-sub">' + (name ? "Every " + esc(name) + " goal is done." : "All next sprint goals done.") +
      " Nice work, team 🎉</div></div>" +
    '<div class="party-dancers">' + dancers.map(([e, move, flip], i) =>
      '<span class="dancer d-' + move + '" style="animation-delay:' + (-i * 0.17).toFixed(2) + 's">' +
      (flip ? '<span class="flip">' + e + "</span>" : e) + "</span>").join("") + "</div>";
  document.body.appendChild(el);

  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sound = partyAudio(PARTY_MS, partySound);
  const stopFireworks = calm ? () => {} : fireworks(el.querySelector("canvas"), PARTY_MS - 1400, sound || {});
  showFor(el, PARTY_MS, () => { stopFireworks(); if (sound) sound.stop(); });
}

/* Runs an overlay already on the page for `ms`, fading it out at the end, and calls `stop`
   however it ends. Esc or a click ends it early, but a click only after the first moment:
   the boo is set off by clicking fast, and the next click of the run must not close it. */
function showFor(el, ms, stop){
  const opened = performance.now();
  const timers = [setTimeout(() => el.classList.add("out"), ms - 600),
                  setTimeout(() => close(), ms)];
  const onKey = (e) => { if (e.key === "Escape") close(); };
  function close(){
    timers.forEach(clearTimeout);
    stop();
    document.removeEventListener("keydown", onKey);
    el.remove();
  }
  el.addEventListener("click", () => { if (performance.now() - opened > 900) close(); });
  document.addEventListener("keydown", onKey);
}

/* ===================================================== five quick clicks: the verdict */

/* Five quick clicks on a card (Sam, 12 Oct 2026) give the crowd's verdict on its goals:
   any still open, or none written, and it boos; all ticked, and the party plays again.
   A click counts when it lands within half a second of the one before, on the same card. */
const taps = { card:null, n:0, at:0 };

function cardTapped(card){
  const now = performance.now();
  taps.n = taps.card === card && now - taps.at < 500 ? taps.n + 1 : 1;
  taps.card = card;
  taps.at = now;
  if (taps.n < 5) return;
  taps.n = 0;
  const goals = [...card.querySelectorAll(".goals li:not(.empty)")];
  const open = goals.filter((li) => !li.classList.contains("done")).length;
  const name = card.querySelector("h3 .name")?.textContent.trim();
  if (goals.length && !open) celebrate(name);
  else boo(name, open, goals.length);
}

const BOO_MS = 10000;
/* Savage about the goals, never about anyone (Sam asked for it savage, and professional). */
const BOO_QUIPS = [
  "The crowd has seen enough.",
  "Bold of you to click on this card.",
  "Ambitious goals. Shame about the ticking.",
  "The tomatoes had a more productive sprint.",
  "Somewhere, a Gantt chart is quietly weeping.",
  "The judges have conferred. It's a no from all of them.",
  "Call that a sprint? The crowd calls it a stroll.",
  "The crowd brought more tomatoes than you ticked goals."
];
const BOO_NO_GOALS = [
  "No goals, no glory. Not even a little bit.",
  "Hard to miss goals you never set. Impressive, really."
];
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];

function boo(name, open, total){
  if (document.querySelector(".party")) return;
  const who = name ? esc(name) + " " : "";
  const sub = !total ? "No " + who + "goals written for next sprint."
    : total === 1 ? "The " + who + "goal is still open."
    : open === total ? "None of the " + total + " " + who + "goals ticked."
    : open + " of " + total + " " + who + "goals still open.";
  const quip = pickOne(total ? BOO_QUIPS : BOO_NO_GOALS);
  /* How far each letter of "BOOOO!" tips and drops when it sags: [degrees, em]. */
  const SAG = [[-6, 0.05], [9, 0.13], [-12, 0.2], [14, 0.16], [-9, 0.24], [98, 0.3]];
  const fans = [["👎","jab"], ["😠","shake"], ["👎","jab"], ["🙄","sulk"], ["😤","shake"],
                ["👎","jab"], ["😒","sulk"], ["👎","jab"], ["😠","shake"], ["👎","jab"]];
  const el = document.createElement("div");
  el.className = "party boo no-print";
  el.setAttribute("role", "status");
  el.innerHTML = '<canvas></canvas><div class="boo-stage">' +
    '<div class="boo-cloud"><span>⛈️</span></div><div class="boo-splats"></div>' +
    '<div class="party-msg"><div class="boo-big">' + [..."BOOOO!"].map((ch, i) =>
      '<span style="--rot:' + SAG[i][0] + "deg;--dy:" + SAG[i][1] + "em;animation-delay:" +
      (i * 0.06).toFixed(2) + "s," + (0.6 + i * 0.06).toFixed(2) + "s," + (3.95 + i * 0.09).toFixed(2) + 's">' +
      ch + "</span>").join("") + "</div>" +
      '<div class="party-sub">' + sub + "</div>" +
      '<div class="boo-quip">' + esc(quip) + "</div></div>" +
    '<div class="boo-stamp">REJECTED</div>' +
    '<div class="boo-crowd">' + fans.map(([e, move], i) =>
      '<span class="fan f-' + move + '" style="animation-delay:' + (-i * 0.11).toFixed(2) + 's">' + e + "</span>").join("") +
      "</div><div class=\"boo-fly\"></div></div>" +
    '<div class="boo-flash"></div><div class="party-hint">Click anywhere to close</div>';
  document.body.appendChild(el);

  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sound = partyAudio(BOO_MS, booSound);
  const stage = el.querySelector(".boo-stage"), splats = el.querySelector(".boo-splats"),
        fly = el.querySelector(".boo-fly");
  /* A jolt of the whole scene, for a tomato or the stamp landing. In the thick of the
     barrage a jolt per splat would never stop, so they are at least 120 ms apart. */
  let lastShake = 0;
  const shake = (px) => {
    const now = performance.now();
    if (calm || !stage.animate || now - lastShake < 120) return;
    lastShake = now;
    stage.animate([{ transform:"none" }, { transform:"translate(" + -px + "px," + px * 0.6 + "px)" },
      { transform:"translate(" + px * 0.8 + "px," + -px * 0.7 + "px)" },
      { transform:"translate(" + -px * 0.4 + "px," + px * 0.3 + "px)" }, { transform:"none" }],
      { duration:280, easing:"ease-out" });
  };
  el.querySelector(".boo-stamp").addEventListener("animationend", () => {
    shake(14);
    if (sound) sound.stamp();
  }, { once:true });
  const stopRain = calm ? () => {} : rain(el.querySelector("canvas"), BOO_MS);

  /* The tomatoes (Sam: more of them, and keep the attack going until the screen is covered).
     First an opening volley, [ms, x, y] with x and y 0 to 1 across the screen: either side
     of the message and one straight at the headline. From 2 s the barrage: faster and
     faster, more and more often two or three at once, each aimed somewhere in the next cell
     of a shuffled grid so the splats spread out and cover the screen, growing as it goes.
     It keeps up until the giant tomato at 8 s, the last of them. */
  const OPENING = [[500, 0.22, 0.3], [800, 0.78, 0.26], [1100, 0.5, 0.22], [1450, 0.3, 0.68], [1750, 0.7, 0.64]];
  const BARRAGE_AT = 2000, MEGA_AT = 8000, COLS = 9, ROWS = 6;
  const started = performance.now();
  let deck = [], timers = [], stopped = false;
  const nextCell = () => {
    if (!deck.length){
      for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) deck.push([c, r]);
      for (let i = deck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }
    const [c, r] = deck.pop();
    return [(c + Math.random()) / COLS, (r + Math.random()) / ROWS];
  };
  const barrage = () => {
    if (stopped) return;
    const t = performance.now() - started;
    if (t >= MEGA_AT){ megaTomato(fly, sound, shake); return; }
    const p = Math.max(0, (t - BARRAGE_AT) / (MEGA_AT - BARRAGE_AT));
    const n = Math.random() < 0.2 + p * 0.4 ? (Math.random() < 0.5 ? 3 : 2) : 1;
    for (let i = 0; i < n; i++){
      const [x, y] = nextCell();
      tomato(splats, fly, x, y, sound, shake, 1 + p * 0.8);
    }
    timers.push(setTimeout(barrage, 200 - p * 165 + Math.random() * 50));   // about 6 a second at first, 30 by the end
  };
  if (!calm){
    const jitter = () => (Math.random() - 0.5) * 0.07;
    timers = OPENING.map(([at, x, y]) =>
      setTimeout(() => tomato(splats, fly, x + jitter(), y + jitter(), sound, shake, 1), at));
    timers.push(setTimeout(barrage, BARRAGE_AT));
  }
  showFor(el, BOO_MS, () => { stopped = true; timers.forEach(clearTimeout); stopRain(); if (sound) sound.stop(); });
}

/* One tomato thrown at the screen, whooshing as it flies, landing at x, y (0 to 1 across it),
   where it leaves a splat `k` times the usual size, in one of four shades so piled-up splats
   still show their edges, and jolts the scene. The splat's sound waits for the tomato to
   land, so the two always line up. */
const SPLAT_REDS = ["#D23C2A", "#C2301F", "#DE4A34", "#B5281A"];

function tomato(splats, fly, x, y, sound, shake, k){
  const t = document.createElement("div");
  t.className = "tomato";
  t.style.left = (x * 100).toFixed(1) + "%";
  t.style.top = (y * 100).toFixed(1) + "%";
  const from = Math.round((0.2 + Math.random() * 0.6 - x) * window.innerWidth);
  t.innerHTML = '<span style="--sx:' + from + "px;--spin:" + Math.round(Math.random() * 720 - 360) + 'deg">🍅</span>';
  fly.appendChild(t);
  if (sound) sound.toss(x, 0.55);
  t.firstChild.addEventListener("animationend", () => {
    t.remove();
    const s = document.createElement("div");
    s.className = "splat";
    s.style.cssText = t.style.cssText + ";--k:" + k.toFixed(2);
    s.innerHTML = splatSVG(pickOne(SPLAT_REDS));
    splats.appendChild(s);
    shake(k > 1.3 ? 5 : 7);
    if (sound) sound.splat(x);
  }, { once:true });
}

/* The finale: one giant tomato straight at the middle of the screen, whose splat covers all
   of it, message and stamp included, with one last line on top. */
function megaTomato(fly, sound, shake){
  const t = document.createElement("div");
  t.className = "tomato mega";
  t.style.left = t.style.top = "50%";
  t.innerHTML = "<span>🍅</span>";
  fly.appendChild(t);
  if (sound) sound.toss(0.5, 0.5, true);
  t.firstChild.addEventListener("animationend", () => {
    t.remove();
    const s = document.createElement("div");
    s.className = "splat mega";
    s.style.left = s.style.top = "50%";
    s.innerHTML = splatSVG(SPLAT_REDS[0], true);
    fly.appendChild(s);
    fly.insertAdjacentHTML("beforeend", '<div class="boo-final">Next sprint, tick them.</div>');
    shake(26);
    if (sound) sound.mega();
  }, { once:true });
}

/* A splat in `red`, different every time: a lumpy blob traced smoothly through points at
   random distances round a circle, with drips hanging off it, spray around it, seeds and a
   shine. `plain` leaves off the seeds and shine, for the giant one, where they would be the
   size of the closing line. */
function splatSVG(red, plain){
  const rnd = (a, b) => a + Math.random() * (b - a);
  const f = (n) => n.toFixed(1);
  const N = 16, pts = [];
  for (let i = 0; i < N; i++){
    const a = i / N * Math.PI * 2 + rnd(-0.08, 0.08);
    const r = i % 2 ? rnd(25, 31) : rnd(31, Math.random() < 0.35 ? 46 : 37);
    pts.push([50 + Math.cos(a) * r, 46 + Math.sin(a) * r]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let d = "M" + mid(pts[N - 1], pts[0]).map(f).join(" ");
  pts.forEach((p, i) => {
    const m = mid(p, pts[(i + 1) % N]);
    d += " Q" + f(p[0]) + " " + f(p[1]) + " " + f(m[0]) + " " + f(m[1]);
  });
  let bits = '<path d="' + d + 'Z"/>';
  for (let i = 0, n = Math.round(rnd(2, 3)); i < n; i++){                // drips
    const w = rnd(4, 7), x = rnd(36, 62) - w / 2, h = rnd(22, 34);
    bits += '<rect x="' + f(x) + '" y="60" width="' + f(w) + '" height="' + f(h) + '" rx="' + f(w / 2) + '"/>' +
            '<circle cx="' + f(x + w / 2) + '" cy="' + f(60 + h - w / 2) + '" r="' + f(w * 0.75) + '"/>';
  }
  for (let i = 0, n = Math.round(rnd(5, 7)); i < n; i++){                // spray
    const a = rnd(0, Math.PI * 2), r = rnd(40, 48);
    bits += '<circle cx="' + f(50 + Math.cos(a) * r) + '" cy="' + f(46 + Math.sin(a) * r) + '" r="' + f(rnd(1.6, 4)) + '"/>';
  }
  let seeds = "";
  for (let i = 0; i < 5; i++){
    const cx = f(50 + rnd(-14, 14)), cy = f(46 + rnd(-12, 12));
    seeds += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="2.2" ry="1.3" transform="rotate(' +
             Math.round(rnd(0, 180)) + " " + cx + " " + cy + ')"/>';
  }
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="' + red + '">' + bits + "</g>" +
    (plain ? "" : '<g fill="#F6D77A" opacity=".85">' + seeds + "</g>" +
      '<ellipse cx="41" cy="37" rx="10" ry="6" fill="#fff" opacity=".18"/>') + "</svg>";
}

/* Rain falling at a slant across the whole canvas. New drops stop after `untilMs` and the
   last ones fall away. Returns a function that stops it. */
function rain(canvas, untilMs){
  const ctx = canvas.getContext("2d");
  const drops = [];
  let W = 0, H = 0, raf = 0, last = performance.now();
  const t0 = last;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function size(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const drop = (y) => ({ x: rnd(-0.05, 1.25) * W, y: y == null ? rnd(-0.25, 0) * H : y,
                         v: rnd(1100, 1700), len: rnd(12, 28), a: rnd(0.2, 0.5) });
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const pouring = now - t0 < untilMs;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.y += d.v * dt;
      d.x -= d.v * 0.18 * dt;
      if (d.y - d.len > H){
        if (pouring) drops[i] = drop(); else drops.splice(i, 1);
        continue;
      }
      ctx.strokeStyle = "rgba(184,201,222," + d.a + ")";
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.len * 0.18, d.y - d.len); ctx.stroke();
    }
    raf = requestAnimationFrame(frame);
  }

  size();
  window.addEventListener("resize", size);
  const n = Math.round(Math.min(460, W * H / 4500));
  for (let i = 0; i < n; i++) drops.push(drop(rnd(0, 1) * H));     // already falling on the first frame
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
}

/* Rockets rise from the bottom and burst at the top of their climb into sparks that drift
   down and fade, with a bigger volley near the end. Rockets stop after `launchMs`. Returns
   a function that stops it. `on.launch(x, secs)` and `on.burst(x)` hear about each rocket,
   x running 0 (left edge) to 1 (right), so the sound can follow it. */
function fireworks(canvas, launchMs, on){
  const ctx = canvas.getContext("2d");
  const COLOURS = ["#4C9DF0", "#12B5A5", "#E0A32E", "#eb6834", "#ff5fa2", "#ffffff", "#8be9a0", "#c38bff"];
  const G = 900;                         // px/s² on a rocket
  const rockets = [], sparks = [];
  let W = 0, H = 0, raf = 0, last = performance.now(), nextAt = 0, finale = false;
  const t0 = last;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = () => COLOURS[Math.floor(Math.random() * COLOURS.length)];

  function size(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function launch(x){
    const peak = rnd(0.1, 0.42) * H;     // bursts in the top part, above the dancers
    const x0 = x == null ? rnd(0.12, 0.88) * W : x;
    const vy = -Math.sqrt(2 * G * (H + 8 - peak));
    rockets.push({ x: x0, y: H + 8, vx: rnd(-40, 40), vy, c: pick() });
    if (on.launch) on.launch(x0 / W, -vy / G);    // climb time: it bursts as it stops rising
  }
  function burst(r){
    if (on.burst) on.burst(r.x / W);
    const n = Math.round(rnd(70, 120));
    const ring = Math.random() < 0.35;   // some bursts are a clean ring, the rest a filled ball
    const two = Math.random() < 0.5 ? pick() : r.c;
    const speed = rnd(220, 380) * Math.min(1.3, Math.max(0.7, H / 900));
    for (let i = 0; i < n && sparks.length < 2200; i++){
      const a = (i / n) * Math.PI * 2 + rnd(-0.05, 0.05);
      const v = ring ? speed * rnd(0.95, 1.05) : speed * Math.sqrt(Math.random());
      const life = rnd(1.1, 1.9);
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                    life, max: life, c: i % 2 ? two : r.c });
    }
  }
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now - t0;
    if (t < launchMs && t >= nextAt){
      const volley = Math.random() < 0.3 ? 2 : 1;
      for (let i = 0; i < volley; i++) launch();
      nextAt = t + rnd(260, 560);
    }
    if (!finale && t >= launchMs - 1500){          // the big finish
      finale = true;
      for (let i = 0; i < 7; i++) launch((0.1 + i * 0.8 / 6) * W);
    }

    /* Fade what is already drawn rather than wiping it, which leaves trails. */
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.vy += G * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      ctx.fillStyle = r.c;
      ctx.beginPath(); ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2); ctx.fill();
      if (r.vy >= -40){ burst(r); rockets.splice(i, 1); }
    }
    const drag = Math.pow(0.4, dt);                // sparks lose 60% of their speed a second
    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.life -= dt;
      if (s.life <= 0){ sparks.splice(i, 1); continue; }
      s.vx *= drag; s.vy = s.vy * drag + 140 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const k = s.life / s.max;
      ctx.globalAlpha = k < 0.3 ? k / 0.3 * (0.6 + Math.random() * 0.4) : 1;   // twinkle out
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.2 + k * 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  size();
  window.addEventListener("resize", size);
  launch(); launch();
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
}

/* An overlay's sound (partySound or booSound), or null when the browser has none. Browsers
   only let a page make a noise straight after a click, which is fine: the tick or the clicks
   that set it off are one. Sound is a nice extra, so any failure here just leaves it silent. */
function partyAudio(ms, make){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    const s = make(ctx, ms);
    s.stop = () => {
      try{
        const now = ctx.currentTime;
        s.bus.gain.cancelScheduledValues(now);
        s.bus.gain.setValueAtTime(s.bus.gain.value, now);
        s.bus.gain.linearRampToValueAtTime(0, now + 0.12);   // a quick fade, never a click
        setTimeout(() => { if (ctx.state !== "closed") ctx.close(); }, 250);
      }catch(e){}
    };
    return s;
  }catch(e){ return null; }
}

/* Everything is synthesised here, so there are no sound files to host. It is a winner's
   fanfare (Sam asked for "more successful" and more clapping): brass plays a rising tune
   over a 120 bpm groove (kick, hats, octave bass, brass stabs, a group clap on 2 and 4) for
   four bars, C F C G, while a crowd claps along, more of them joining as it goes, with a
   clap roll into the last beat. At 8 s it lands on a big C major chord as the final volley
   bursts, fans whistle, and it rings out under the fade, all in a hall's echo. On top, each
   rocket whistles as it climbs and each burst booms and crackles, panned to where it is on
   screen. Takes any AudioContext, so an OfflineAudioContext can render it to test. */
function partySound(ctx, ms){
  /* The crowd is slow to write (see soundStage), so it goes before the clock is read. */
  const claps = crowdClaps(ctx, ms / 1000);
  const { t0, bus, toRoom, voice } = soundStage(ctx, ms, 0.65);

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* One brass note: two saws a few cents apart through a filter that opens on the attack,
     the bite of a trumpet, then settles, with a little vibrato on held notes. */
  function brass(at, dur, midi, vol, pan = 0){
    const f = hz(midi), stop = at + dur + 0.15;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.025);
    g.gain.exponentialRampToValueAtTime(vol * 0.7, at + Math.min(0.2, dur));
    g.gain.setValueAtTime(vol * 0.7, at + dur);
    g.gain.exponentialRampToValueAtTime(0.0001, stop);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.Q.value = 1.5;
    lp.frequency.setValueAtTime(f * 1.5, at);
    lp.frequency.exponentialRampToValueAtTime(Math.min(10000, f * 8), at + 0.04);
    lp.frequency.exponentialRampToValueAtTime(Math.min(7000, f * 4), at + 0.25);
    lp.connect(g);
    let wobble = null;
    if (dur > 0.45){
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 5.5;
      wobble = ctx.createGain();
      wobble.gain.setValueAtTime(0, at);
      wobble.gain.linearRampToValueAtTime(f * 0.006, at + 0.4);
      lfo.connect(wobble);
      lfo.start(at); lfo.stop(stop);
    }
    [-5, 5].forEach((cents) => {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.value = f;
      o.detune.value = cents;
      if (wobble) wobble.connect(o.frequency);
      o.connect(lp);
      o.start(at); o.stop(stop);
    });
    let node = g;
    if (pan && ctx.createStereoPanner){
      const p = ctx.createStereoPanner();
      p.pan.value = pan;
      g.connect(p); node = p;
    }
    node.connect(bus);
    toRoom(node, 0.35);
  }

  const kick = (t) => voice({ at:t, dur:0.32, type:"sine", freq:150, freqTo:42, vol:0.75 });
  const hat  = (t, v) => voice({ at:t, dur:0.05, filter:"highpass", f:7000, vol:v || 0.07 });
  /* A clap the way a few people make one together: three slaps a few ms apart, the last
     one ringing a little longer. */
  const clap = (t, v = 0.3, pan = 0) => [0, 0.008, 0.017].forEach((d, i) =>
    voice({ at:t + d, dur:i < 2 ? 0.03 : 0.18, filter:"bandpass", f:rnd(1100, 1600), q:1.2,
            vol:v, attack:0.001, pan, wet:0.3 }));

  /* The groove. Each chord is a bass root (C2 etc.) and the three notes of its brass stabs. */
  const BEAT = 0.5;
  const CHORDS = [[36, 52, 55, 60], [41, 53, 57, 60], [36, 52, 55, 60], [43, 50, 55, 59]];
  CHORDS.forEach(([root, ...tones], bar) => {
    const b0 = t0 + bar * 4 * BEAT;
    for (let beat = 0; beat < 4; beat++){
      const t = b0 + beat * BEAT;
      kick(t);
      if (beat % 2) clap(t, 0.32);
      if (bar === 3){                                // the claps double up into the big chord
        const roll = beat === 3 ? [0.25, 0.5, 0.75] : [0.5];
        roll.forEach((d) => clap(t + d * BEAT, 0.14 + beat * 0.05));
      }
      hat(t + BEAT / 2);
      voice({ at:t, dur:0.2, type:"sawtooth", freq:hz(root), filter:"lowpass", f:650, vol:0.15 });
      voice({ at:t + BEAT / 2, dur:0.2, type:"sawtooth", freq:hz(root + 12), filter:"lowpass", f:900, vol:0.13 });
    }
    [0, 2.5].forEach((b) => tones.forEach((m, i) => brass(b0 + b * BEAT, 0.22, m, 0.02, (i - 1) * 0.4)));
  });

  /* The fanfare, as [beat, beats long, note]: a call of three, up through the chord, and a
     climb into the top C on the big hit. */
  const TUNE = [[0, 1/3, 67], [1/3, 1/3, 67], [2/3, 1/3, 67], [1, 1.5, 72], [2.5, 0.5, 76], [3, 1, 79],
                [4, 1.5, 81], [5.5, 0.5, 79], [6, 0.5, 77], [6.5, 0.5, 81], [7, 1, 84],
                [8, 1.5, 79], [9.5, 0.5, 76], [10, 0.5, 72], [10.5, 0.5, 76], [11, 1, 79],
                [12, 1, 83], [13, 0.5, 81], [13.5, 0.5, 83], [14, 1, 86],
                [15, 1/3, 79], [15 + 1/3, 1/3, 81], [15 + 2/3, 1/3, 83]];
  TUNE.forEach(([b, len, m]) => brass(t0 + b * BEAT, len * BEAT * (len < 0.5 ? 0.7 : 0.9), m, 0.06));

  const hit = t0 + 16 * BEAT;                        // 8 s in
  kick(hit);
  voice({ at:hit, dur:1.4, type:"sine", freq:90, freqTo:55, vol:0.5 });                // timpani
  voice({ at:hit, dur:1.8, filter:"highpass", f:5000, vol:0.12, wet:0.4 });            // crash cymbal
  [48, 55, 60, 64, 67, 72, 76].forEach((m, i) => brass(hit, 1.5, m, 0.03, (i / 6 - 0.5) * 0.8));
  brass(hit, 1.6, 84, 0.07);                                                           // the top C
  [[0.25, -0.6], [0.7, 0.5], [1.2, -0.2]].forEach(([d, pan]) => {                      // fans whistle
    voice({ at:hit + d, dur:0.25, type:"sine", freq:1500, freqTo:2700, vol:0.04, attack:0.03, pan, wet:0.4 });
    voice({ at:hit + d + 0.3, dur:0.5, type:"sine", freq:2700, freqTo:1600, vol:0.035, attack:0.02, pan, wet:0.4 });
  });

  /* The crowd: most of them clapping from the first beat, everyone by 6 s, loudest just
     after the big chord, when it is as loud as the band. */
  const crowd = ctx.createBufferSource();
  crowd.buffer = claps;
  const cg = ctx.createGain();
  cg.gain.setValueAtTime(0.6, t0);
  cg.gain.linearRampToValueAtTime(0.85, hit - 0.1);
  cg.gain.linearRampToValueAtTime(1.3, hit + 0.4);
  crowd.connect(cg);
  cg.connect(bus);
  toRoom(cg, 0.5);
  crowd.start(t0);

  /* Fireworks, told about by fireworks(). x is 0 to 1 across the screen. */
  const panOf = (x) => (x * 2 - 1) * 0.8;
  return {
    bus,
    launch(x, secs){
      try{
        const at = ctx.currentTime, dur = Math.max(0.4, secs);
        voice({ at, dur, type:"sine", freq:rnd(600, 900), freqTo:rnd(1700, 2300),
                vol:0.025, attack:0.08, pan:panOf(x) });
      }catch(e){}
    },
    burst(x){
      try{
        const at = ctx.currentTime, pan = panOf(x);
        voice({ at, dur:0.5, type:"sine", freq:120, freqTo:38, vol:0.55, pan });               // thump
        voice({ at, dur:1.3, filter:"lowpass", f:2600, fTo:180, vol:0.5, attack:0.003, pan }); // boom
        const crackles = Math.round(rnd(8, 16));
        for (let i = 0; i < crackles; i++){
          voice({ at:at + rnd(0.25, 1.3), dur:0.03, filter:"highpass", f:3000,
                  vol:rnd(0.05, 0.13), attack:0.001, pan:pan + rnd(-0.25, 0.25) });
        }
      }catch(e){}
    }
  };
}

/* What the party and the boo both play through: a bus at `level` that fades out with the
   overlay, a compressor so stacked hits never clip, a hall any sound can send some of itself
   to, and voice(), which plays one note or hit. The noise and the hall, plus the caller's own
   buffers, take over a tenth of a second to write on a cold page, and setting up the notes
   about as long again, while the audio clock keeps running. Every note is timed from t0, so
   t0 is read here, after the buffers, and a quarter second ahead, or the opening notes would
   be due before they were set up. With `drive`, the compressor's output is turned up by that
   much into a soft clipper, which makes everything louder while the peaks stay under full
   scale. The party has none. */
function soundStage(ctx, ms, level, drive){
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const hall = hallEcho(ctx, 1.8);

  const now = ctx.currentTime, t0 = now + 0.25, end = now + ms / 1000;
  const bus = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();     // the party's stacked booms would clip
  comp.threshold.value = -20; comp.knee.value = 10; comp.ratio.value = 10;
  comp.attack.value = 0.001; comp.release.value = 0.2;
  bus.gain.setValueAtTime(level, now);
  bus.gain.setValueAtTime(level, end - 0.6);       // fades with the overlay
  bus.gain.linearRampToValueAtTime(0.0001, end);
  bus.connect(comp);
  if (drive){
    const push = ctx.createGain(), clip = ctx.createWaveShaper(), curve = new Float32Array(2049);
    push.gain.value = drive;
    for (let i = 0; i < curve.length; i++){
      const x = i / 1024 - 1;
      curve[i] = 0.97 * Math.tanh(1.2 * x) / Math.tanh(1.2);
    }
    clip.curve = curve;
    clip.oversample = "2x";
    comp.connect(push); push.connect(clip); clip.connect(ctx.destination);
  } else {
    comp.connect(ctx.destination);
  }

  const room = ctx.createConvolver();              // the hall: any sound can send some here
  room.buffer = hall;
  const roomOut = ctx.createGain();
  roomOut.gain.value = 0.45;
  room.connect(roomOut);
  roomOut.connect(bus);
  const toRoom = (node, wet) => {
    if (!wet) return;
    const send = ctx.createGain();
    send.gain.value = wet;
    node.connect(send);
    send.connect(room);
  };

  /* One note or hit: an oscillator (or noise when there is no `type`), an optional filter,
     a quick attack and a decay to nothing over `dur`, panned, into the bus, with `wet` of
     it sent to the hall. */
  function voice({ at, dur, type, freq, freqTo, filter, f, fTo, q = 1, vol, pan = 0, attack = 0.004, wet = 0 }){
    let src;
    if (type){
      src = ctx.createOscillator();
      src.type = type;
      src.frequency.setValueAtTime(freq, at);
      if (freqTo) src.frequency.exponentialRampToValueAtTime(freqTo, at + dur);
    } else {
      src = ctx.createBufferSource();
      src.buffer = noise;
      src.loop = true;
    }
    let node = src;
    if (filter){
      const bq = ctx.createBiquadFilter();
      bq.type = filter; bq.Q.value = q;
      bq.frequency.setValueAtTime(f, at);
      if (fTo) bq.frequency.exponentialRampToValueAtTime(fTo, at + dur);
      node.connect(bq); node = bq;
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    node.connect(g); node = g;
    if (pan && ctx.createStereoPanner){
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      node.connect(p); node = p;
    }
    node.connect(bus);
    toRoom(node, wet);
    if (type) src.start(at); else src.start(at, Math.random() * 0.5);
    src.stop(at + dur + 0.05);
  }

  return { t0, bus, toRoom, voice };
}

/* The boo's sound, all synthesised like the party's, and driven louder than it (Sam: "louder
   and more savage"). It opens on a thunderclap. A big crowd boos all the way through, a few
   of them shouting, others whistling. They drop back for a trombone's classic wah wah wah
   waaah, its last note growling, then come back chanting BOO in time, stamping their feet,
   until the giant tomato lands with a huge splat and they roar. Each tomato whooshes as it
   flies and splats where it lands, panned to where it is on screen, and the stamp lands with
   a thump. Timed to the overlay: the trombone's last note is when the letters sag. */
function booSound(ctx, ms){
  const { t0, bus, toRoom, voice } = soundStage(ctx, ms, 0.9, 1.6);
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pan = (node, p) => {
    if (!ctx.createStereoPanner) return node;
    const sp = ctx.createStereoPanner();
    sp.pan.value = p;
    node.connect(sp);
    return sp;
  };

  /* Thunder with the lightning: a crack, a long low rumble, and a thump you feel. */
  voice({ at:t0, dur:0.3, filter:"highpass", f:1800, vol:0.55, attack:0.001, wet:0.4 });
  voice({ at:t0 + 0.02, dur:2.6, filter:"lowpass", f:900, fTo:60, q:0.7, vol:0.9, attack:0.02, wet:0.5 });
  voice({ at:t0, dur:1.3, type:"sine", freq:70, freqTo:28, vol:0.6 });

  /* A section of the crowd: one mouth, an angry "oo" made by two formant filters with some
     raw buzz left on top, panned to `where`, into `dest`, with `wet` of it sent to the hall.
     Voices go into what it returns. A section shares one mouth because forty mouths, each
     with its own filters running for nine seconds, took a third of the audio thread; in a
     crowd nobody can hear the difference. */
  const section = (high, buzz, where, dest, wet) => {
    const lift = high ? 1.15 : 1;
    const input = ctx.createGain(), out = ctx.createGain();
    const f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter();
    const g2 = ctx.createGain(), gb = ctx.createGain();
    f1.type = f2.type = "bandpass";
    lp.type = "lowpass";
    f1.frequency.value = rnd(300, 380) * lift; f1.Q.value = 3;
    f2.frequency.value = rnd(820, 950) * lift; f2.Q.value = 4;
    lp.frequency.value = 1600;
    g2.gain.value = 0.45;
    gb.gain.value = buzz;
    input.connect(f1); input.connect(f2); input.connect(lp);
    f1.connect(out); f2.connect(g2); g2.connect(out); lp.connect(gb); gb.connect(out);
    const panned = pan(out, where);
    panned.connect(dest);
    toRoom(panned, wet);
    return input;
  };
  /* One booing voice: a sawtooth with its own wobble, into `env` (which goes into a section).
     Returns the oscillator so its pitch can be moved. */
  const throat = (f0, wobble, env) => {
    const o = ctx.createOscillator();
    o.type = "sawtooth";
    const lfo = ctx.createOscillator();
    lfo.frequency.value = rnd(4.5, 6.5);
    const wob = ctx.createGain();
    wob.gain.value = f0 * wobble;
    lfo.connect(wob);
    wob.connect(o.frequency);
    o.connect(env);
    return { o, lfo };
  };
  const start = (v, at, stop) => { v.o.start(at); v.lfo.start(at); v.o.stop(stop); v.lfo.stop(stop); };

  /* The crowd: forty people in eight sections (four places across, low voices and high),
     booing over and over, every boo hitting hard on its "B" and sliding down in pitch. They
     drop back under the trombone, come up again with the chant, and give way to their own
     roar when the giant tomato lands. */
  const crowd = ctx.createGain();
  crowd.gain.setValueAtTime(1, t0);
  crowd.gain.setValueAtTime(1, t0 + 2.4);
  crowd.gain.linearRampToValueAtTime(0.5, t0 + 3);
  crowd.gain.setValueAtTime(0.5, t0 + 5.1);
  crowd.gain.linearRampToValueAtTime(0.85, t0 + 5.5);
  crowd.gain.setValueAtTime(0.85, t0 + 8.2);
  crowd.gain.linearRampToValueAtTime(0.3, t0 + 8.6);
  crowd.connect(bus);
  toRoom(crowd, 0.5);
  const PLACES = [-0.75, -0.25, 0.25, 0.75];
  const sections = PLACES.map((w) => [false, true].map((high) => section(high, 0.12, w + rnd(-0.1, 0.1), crowd, 0)));
  for (let p = 0; p < 40; p++){
    const high = p % 10 > 6, f0 = high ? rnd(165, 235) : rnd(85, 140);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t0);
    env.connect(sections[p % 4][high ? 1 : 0]);
    const v = throat(f0, 0.015, env);
    let t = t0 + rnd(0.05, 0.6);
    const until = t0 + rnd(8.4, 9.2);
    while (t < until){
      const len = rnd(0.7, 1.6), lvl = rnd(0.6, 1) * 0.5;
      v.o.frequency.setValueAtTime(f0 * 1.08, t);
      v.o.frequency.exponentialRampToValueAtTime(f0 * 0.86, t + len);
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(lvl, t + 0.07);
      env.gain.setValueAtTime(lvl, t + len - 0.3);
      env.gain.linearRampToValueAtTime(0, t + len);
      voice({ at:t, dur:0.05, filter:"lowpass", f:700, vol:0.04, attack:0.002 });   // the "B", too short to place
      t += len + rnd(0.12, 0.4);
    }
    start(v, t0, t + 0.1);
  }

  /* The loudest few: short shouted BOOs, higher and rawer, that cut through the rest. */
  [[0.35, 170, -0.5], [0.8, 210, 0.6], [1.3, 150, -0.1], [1.75, 230, 0.4], [2.15, 185, -0.7], [2.6, 160, 0.2]]
    .forEach(([d, f0, where]) => {
      const at = t0 + d, len = rnd(0.45, 0.65);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, at);
      env.gain.linearRampToValueAtTime(0.3, at + 0.03);
      env.gain.setValueAtTime(0.3, at + len - 0.15);
      env.gain.linearRampToValueAtTime(0, at + len);
      env.connect(section(true, 0.22, where, bus, 0.3));
      const v = throat(f0, 0.02, env);
      v.o.frequency.setValueAtTime(f0 * 1.12, at);
      v.o.frequency.exponentialRampToValueAtTime(f0 * 0.82, at + len);
      start(v, at, at + len + 0.05);
    });

  /* From 5.4 s, with the trombone done, fourteen of them chant together in time with the
     barrage: BOO! every 0.55 s, with a stamp of feet on each. Each chanter is a little off
     the beat, as a crowd is. The last BOO is just before the giant tomato. */
  const chant = ctx.createGain();
  chant.gain.value = 1;
  chant.connect(bus);
  toRoom(chant, 0.45);
  const BEATS = [5.4, 5.95, 6.5, 7.05, 7.6];
  const chanters = [-0.45, 0.45].map((w) => [false, true].map((high) => section(high, 0.18, w, chant, 0)));
  for (let p = 0; p < 14; p++){
    const high = p % 3 === 0, f0 = high ? rnd(175, 225) : rnd(95, 135);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t0);
    env.connect(chanters[p % 2][high ? 1 : 0]);
    const v = throat(f0, 0.012, env);
    BEATS.forEach((b) => {
      const at = t0 + b + rnd(-0.025, 0.025);
      v.o.frequency.setValueAtTime(f0 * 1.1, at);
      v.o.frequency.exponentialRampToValueAtTime(f0 * 0.84, at + 0.4);
      env.gain.setValueAtTime(0, at);
      env.gain.linearRampToValueAtTime(0.32, at + 0.04);
      env.gain.setValueAtTime(0.32, at + 0.26);
      env.gain.linearRampToValueAtTime(0, at + 0.4);
    });
    start(v, t0 + 5.3, t0 + 8.1);
  }
  BEATS.forEach((b) => {
    voice({ at:t0 + b, dur:0.2, type:"sine", freq:95, freqTo:38, vol:0.6 });                // the stamp
    voice({ at:t0 + b, dur:0.1, filter:"lowpass", f:320, vol:0.4, attack:0.002, wet:0.3 });  // of feet
  });

  /* Whistles of disapproval from the stands, shrill and long, all the way through. */
  [[0.4, 1.1, 3200, -0.6], [0.9, 1.4, 2800, 0.55], [1.6, 0.9, 3500, -0.2], [2.0, 1.3, 3000, 0.7], [2.6, 0.8, 3300, -0.4],
   [5.0, 1.2, 3100, 0.3], [6.2, 1.0, 2900, -0.55], [7.3, 1.1, 3400, 0.6]]
    .forEach(([d, dur, f, where]) => {
      const at = t0 + d;
      const o = ctx.createOscillator(), lfo = ctx.createOscillator(), vib = ctx.createGain(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f * 0.9, at);
      o.frequency.exponentialRampToValueAtTime(f, at + 0.06);
      o.frequency.setValueAtTime(f, at + dur - 0.18);
      o.frequency.exponentialRampToValueAtTime(f * 0.78, at + dur);
      lfo.frequency.value = 7;
      vib.gain.value = f * 0.008;
      lfo.connect(vib); vib.connect(o.frequency);
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(0.06, at + 0.04);
      g.gain.setValueAtTime(0.06, at + dur - 0.1);
      g.gain.linearRampToValueAtTime(0, at + dur);
      o.connect(g);
      const out = pan(g, where);
      out.connect(bus);
      toRoom(out, 0.35);
      o.start(at); lfo.start(at); o.stop(at + dur + 0.05); lfo.stop(at + dur + 0.05);
    });

  /* One trombone note: two saws through a resonant low-pass that opens on the note and
     half closes again, a plunger mute's "wah". It scoops up into its pitch. The last note
     (`sag`) wobbles in pitch and wah alike, growls (a fast flutter in its volume), then
     droops flat as it dies. */
  function trombone(at, dur, midi, vol, sag){
    const f = hz(midi), stop = at + dur + 0.1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.05);
    g.gain.setValueAtTime(vol, at + dur - 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, stop);
    const wah = ctx.createBiquadFilter();
    wah.type = "lowpass"; wah.Q.value = 7;
    wah.frequency.setValueAtTime(300, at);
    wah.frequency.exponentialRampToValueAtTime(1500, at + 0.14);
    wah.frequency.exponentialRampToValueAtTime(650, at + Math.min(dur, 0.45));
    let wobble = null;
    if (sag){
      const am = ctx.createGain(), growl = ctx.createOscillator(), depth = ctx.createGain();
      am.gain.value = 0.7;
      growl.frequency.value = 28;
      depth.gain.setValueAtTime(0, at);
      depth.gain.linearRampToValueAtTime(0.3, at + 0.5);
      growl.connect(depth); depth.connect(am.gain);
      wah.connect(am); am.connect(g);
      growl.start(at); growl.stop(stop);
    } else {
      wah.connect(g);
    }
    if (sag){
      wah.frequency.setValueAtTime(650, at + dur - 0.4);
      wah.frequency.exponentialRampToValueAtTime(320, at + dur);
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 6;
      wobble = ctx.createGain();
      wobble.gain.setValueAtTime(0, at);
      wobble.gain.linearRampToValueAtTime(f * 0.035, at + 0.8);
      const wahWob = ctx.createGain();
      wahWob.gain.setValueAtTime(0, at);
      wahWob.gain.linearRampToValueAtTime(380, at + 0.6);
      lfo.connect(wobble);
      lfo.connect(wahWob);
      wahWob.connect(wah.frequency);
      lfo.start(at); lfo.stop(stop);
    }
    [-6, 6].forEach((cents) => {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.detune.value = cents;
      o.frequency.setValueAtTime(f * 0.96, at);
      o.frequency.exponentialRampToValueAtTime(f, at + 0.08);
      if (sag){
        o.frequency.setValueAtTime(f, at + dur - 0.5);
        o.frequency.exponentialRampToValueAtTime(f * 0.89, at + dur);
      }
      if (wobble) wobble.connect(o.frequency);
      o.connect(wah);
      o.start(at); o.stop(stop);
    });
    g.connect(bus);
    toRoom(g, 0.3);
  }
  [[2.2, 58], [2.7, 57], [3.2, 56]].forEach(([at, m]) => trombone(t0 + at, 0.42, m, 0.22));
  trombone(t0 + 3.7, 1.7, 55, 0.26, true);

  /* Tomatoes, told about by tomato() and megaTomato(), and the stamp. x is 0 to 1 across
     the screen. */
  const panOf = (x) => (x * 2 - 1) * 0.8;
  return {
    bus,
    stamp(){
      try{
        const at = ctx.currentTime;
        voice({ at, dur:0.3, type:"sine", freq:120, freqTo:42, vol:0.9 });                         // thump
        voice({ at, dur:0.14, filter:"bandpass", f:700, q:0.8, vol:0.7, attack:0.001, wet:0.35 });  // slap
        voice({ at, dur:0.05, filter:"highpass", f:3000, vol:0.35, attack:0.001 });                 // crack
      }catch(e){}
    },
    /* A throw: the flick as it leaves the hand, then a whoosh that rises and grows as it
       comes at the screen, peaking just before it lands. `big` is the giant one. */
    toss(x, secs, big){
      try{
        const at = ctx.currentTime, p = panOf(x);
        voice({ at, dur:secs, filter:"bandpass", f:big ? 200 : 450, fTo:big ? 1400 : 3000, q:big ? 0.9 : 1.6,
                vol:big ? 0.7 : 0.26, attack:secs * 0.75, pan:p });                                     // whoosh
        voice({ at, dur:0.07, filter:"highpass", f:1800, vol:big ? 0.3 : 0.16, attack:0.002, pan:p });  // flick
      }catch(e){}
    },
    mega(){
      try{
        const at = ctx.currentTime;
        voice({ at, dur:0.9, type:"sine", freq:110, freqTo:28, vol:1 });                                   // thud
        voice({ at, dur:1.4, filter:"lowpass", f:3000, fTo:120, vol:1, attack:0.003, wet:0.5 });           // squelch
        voice({ at, dur:0.35, filter:"highpass", f:2000, fTo:5000, vol:0.5, attack:0.001, wet:0.3 });      // spatter
        voice({ at:at + 0.05, dur:1.6, filter:"bandpass", f:900, q:0.6, vol:0.45, attack:0.3, wet:0.6 });  // the roar
      }catch(e){}
    },
    /* The crowd fills everything up to about 1 kHz, so the wet top end of a splat is what
       carries it over them. */
    splat(x){
      try{
        const at = ctx.currentTime, p = panOf(x);
        voice({ at, dur:0.16, type:"sine", freq:170, freqTo:55, vol:0.7, pan:p });                       // thud
        voice({ at, dur:0.28, filter:"lowpass", f:2400, fTo:200, vol:0.7, attack:0.002, pan:p, wet:0.2 }); // squelch
        voice({ at:at + 0.01, dur:0.09, filter:"bandpass", f:1100, q:0.9, vol:0.45, attack:0.001, pan:p }); // slap
        voice({ at, dur:0.12, filter:"highpass", f:2500, fTo:4500, vol:0.3, attack:0.001, pan:p });         // spatter
      }catch(e){}
    }
  };
}

/* A crowd clapping, written straight into a buffer: forty people, each at their own pace
   from their own seat, most from the start and the rest joining in by 6 s. Each
   clap is a burst of noise rung through a hand-sized resonance, so no two sound alike. */
function crowdClaps(ctx, secs){
  const sr = ctx.sampleRate, n = Math.ceil(secs * sr), len = Math.round(0.05 * sr);
  const buf = ctx.createBuffer(2, n, sr);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let p = 0; p < 40; p++){
    const pan = rnd(-0.9, 0.9), gl = Math.cos((pan + 1) * Math.PI / 4), gr = Math.sin((pan + 1) * Math.PI / 4);
    const w = 2 * Math.PI * rnd(800, 2400) / sr, alpha = Math.sin(w) / (2 * rnd(1.2, 3));
    const b0 = alpha / (1 + alpha), a1 = -2 * Math.cos(w) / (1 + alpha), a2 = (1 - alpha) / (1 + alpha);
    const decay = Math.exp(-1 / (rnd(0.006, 0.014) * sr));
    const gap = 1 / rnd(3.2, 5.5), loud = rnd(0.4, 1);
    for (let t = p < 24 ? rnd(0, 0.6) : rnd(0.6, 6); t < secs; t += gap * rnd(0.85, 1.15)){
      const i0 = Math.round(t * sr);
      let env = loud * rnd(0.7, 1), x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let k = 0; k < len && i0 + k < n; k++){
        const x = (Math.random() * 2 - 1) * env;
        const y = b0 * (x - x2) - a1 * y1 - a2 * y2;   // band-pass
        x2 = x1; x1 = x; y2 = y1; y1 = y;
        L[i0 + k] += y * gl;
        R[i0 + k] += y * gr;
        env *= decay;
      }
    }
  }
  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  if (peak) for (let i = 0; i < n; i++){ L[i] /= peak; R[i] /= peak; }
  return buf;
}

/* A hall's echo for the convolver: stereo noise dying away over `secs`. */
function hallEcho(ctx, secs){
  const n = Math.round(secs * ctx.sampleRate);
  const buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++){
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  }
  return buf;
}

function noteFor(code){
  const wk = weekEntry(DATA.weeks[weekIdx].start);
  wk.projects = wk.projects || {};
  return wk.projects[code] || (wk.projects[code] = {});
}

function renderMeta(){
  const when = DATA ? fmtWhen(DATA.generated_at) : "never";
  $("syncMeta").innerHTML = "<b>Synced " + esc(when) + "</b>" +
    (ONLINE ? "live from Jira" : "cannot reach Abacus");
  $("syncBtn").disabled = !ONLINE;
  $("syncBtn").title = ONLINE ? "Pull the latest from Jira" : "Abacus is not responding - reload the page";
}

function flash(msg, kind){
  const el = document.createElement("div");
  el.className = "notice " + (kind || "info");
  el.innerHTML = msg;
  $("alerts").prepend(el);
  if (kind !== "err") setTimeout(() => el.remove(), 6000);
}

/* ===================================================== notes: server first, browser as backup */

/* The weeks edited since the last save. Noted when the edit happens, not when the save
   fires, so ticking a goal and then stepping to another week still saves the right one. */
const unsavedWeeks = new Set();

function queueSave(){
  unsavedWeeks.add(DATA.weeks[weekIdx].start);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNotes, 700);
}

async function saveNotes(){
  const keys = [...unsavedWeeks];
  unsavedWeeks.clear();
  try{ localStorage.setItem("retroNotes", JSON.stringify(NOTES)); }catch(e){}
  if (!ONLINE) return;
  for (const key of keys){
    try{
      const r = await fetch("/api/retro/notes", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ week:key, entry:NOTES.weeks[key] })
      });
      if (signedOut(r)) return;
      const j = await r.json();
      if (j.error) flash("Could not save notes: " + esc(j.error), "err");
      else $("notesHint").textContent = "Saved " + fmtWhen(j.saved_at) + ".";
    }catch(e){
      flash("Could not save notes to Abacus, so kept a copy in this browser.", "err");
    }
  }
}

async function loadNotes(){
  if (ONLINE){
    try{
      const r = await fetch("/api/retro/notes");
      if (signedOut(r)) return;
      const j = await r.json();
      NOTES = (j && j.weeks) ? j : { weeks:{} };
      return;
    }catch(e){ /* fall through to the browser copy */ }
  }
  try{
    const raw = localStorage.getItem("retroNotes");
    NOTES = raw ? JSON.parse(raw) : { weeks:{} };
  }catch(e){ NOTES = { weeks:{} }; }
  NOTES.weeks = NOTES.weeks || {};
}

/* ===================================================== sync */

/* An expired Abacus login answers the API with 401. Send the person to sign in again
   rather than showing an empty dashboard. */
function signedOut(r){
  if (r.status === 401){ window.location.href = "/login"; return true; }
  return false;
}

async function fetchData(){
  const r = await fetch("/api/retro/data", { cache:"no-store" });
  if (signedOut(r)) return null;
  const j = await r.json();
  return (j && Array.isArray(j.weeks)) ? j : null;
}

const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

/* The pull runs in the background on the server (it takes ~30s, which is longer than a
   web request may safely wait), so start it, then poll until the stored pull changes.
   Watching the data's own timestamp as well as the status means it still finishes
   correctly if the server runs more than one worker and the status call lands on another. */
/* The page opens on the stored pull and only syncs when the button is pressed. It used to
   sync by itself on opening and on coming back to the tab; Sam asked for that to stop
   (5 Oct 2026). "Synced ..." beside the button says how fresh the figures are. */
let syncing = false;

/* How long a sync should take, in seconds: what the last one took in this browser, start to
   finish, else the server's own time for the stored pull plus the polling on top. */
function syncEstimate(){
  let secs = NaN;
  try{ secs = parseFloat(localStorage.getItem("retroSyncSecs")); }catch(e){}
  if (!(secs > 0) && DATA && DATA.elapsed_seconds) secs = DATA.elapsed_seconds + 3;
  return Math.max(8, secs > 0 ? secs : 35);
}

/* Fills the bar left to right and counts down beside the button. Returns a stop function
   that runs the bar to the end (done) or just clears it (failed). */
function startProgress(){
  const bar = $("syncBar"), fill = bar.querySelector("i"), meta = $("syncMeta");
  const est = syncEstimate(), t0 = Date.now();
  const tick = () => {
    const s = (Date.now() - t0) / 1000;
    fill.style.width = (Math.min(s / est, 0.97) * 100) + "%";
    const left = Math.ceil(est - s);
    meta.innerHTML = "<b>Syncing from Jira</b><span class='left'>" +
      (left > 0 ? "about " + left + "s left" : "almost done...") + "</span>";
  };
  fill.style.width = "0";
  bar.classList.add("on");
  tick();
  const timer = setInterval(tick, 250);
  return (ok) => {
    clearInterval(timer);
    if (ok){
      try{ localStorage.setItem("retroSyncSecs", String(Math.round((Date.now() - t0) / 100) / 10)); }catch(e){}
      fill.style.width = "100%";
    }
    setTimeout(() => {
      bar.classList.remove("on");
      setTimeout(() => { fill.style.width = "0"; }, 300);
    }, ok ? 450 : 0);
    renderMeta();
  };
}

async function sync(){
  if (syncing) return;
  syncing = true;
  const btn = $("syncBtn"), icon = $("syncIcon");
  btn.disabled = true; icon.className = "spinning";
  const stopProgress = startProgress();
  let ok = false;
  try{
    const before = DATA ? DATA.generated_at : null;
    const r = await fetch("/api/retro/sync", { method:"POST" });
    if (signedOut(r)) return;
    const started = (await r.json()).started_at;

    let fresh = null, err = null;
    for (let i = 0; i < 90 && !fresh && !err; i++){          // give up after 3 minutes
      await sleep(2000);
      const s = await (await fetch("/api/retro/sync", { cache:"no-store" })).json();
      if (s.started_at === started && !s.running){
        if (s.error) err = s.error;
        else fresh = await fetchData();
      } else if (s.started_at !== started){
        const d = await fetchData();
        if (d && d.generated_at !== before) fresh = d;
      }
    }
    if (err){ flash("Jira sync failed: " + esc(err), "err"); return; }
    if (!fresh){ flash("The Jira sync is taking longer than usual. Reload the page in a minute to see it.", "err"); return; }

    ok = true;
    /* Stay on the week you were looking at, unless that was this sprint by default: then
       go to this sprint in the new pull, which may hold a week the old one did not. */
    const had = DATA && DATA.weeks.length;
    const keepWeek = had && weekIdx !== defaultWeekIndex() ? DATA.weeks[weekIdx].start : null;
    DATA = fresh;
    const found = keepWeek ? DATA.weeks.findIndex((w) => w.start === keepWeek) : -1;
    weekIdx = found >= 0 ? found : defaultWeekIndex();
    render();
    flash("Pulled " + DATA.counts.completed_issues + " completed sprint items from Jira in " +
          DATA.elapsed_seconds + "s.", "info");
  }catch(e){
    flash("Could not reach Abacus. Check your connection and try again.", "err");
  }finally{
    syncing = false;
    btn.disabled = !ONLINE; icon.className = "";
    stopProgress(ok);                        // clears on the error path too
  }
}

/* ===================================================== boot */

async function boot(){
  try{
    DATA = await fetchData();
    ONLINE = true;
  }catch(e){ ONLINE = false; }

  await loadNotes();
  await loadPinned();
  weekIdx = defaultWeekIndex();
  render();
  renderCustPicker();

  $("custBtn").onclick = (e) => { e.stopPropagation(); setCustMenu($("custMenu").hidden); };
  document.addEventListener("click", (e) => {
    if (!$("custMenu").hidden && !e.target.closest("#custPick")) setCustMenu(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("custMenu").hidden){ setCustMenu(false); $("custBtn").focus(); }
  });

  $("syncBtn").onclick = () => sync();
  $("pullBtn").onclick = pullGoals;
  $("printBtn").onclick = () => window.print();
  $("prevWk").onclick = () => { if (weekIdx > 0){ weekIdx--; render(); } };
  $("nextWk").onclick = () => { if (weekIdx < DATA.weeks.length - 1){ weekIdx++; render(); } };
  $("weekSel").onchange = (e) => { weekIdx = +e.target.value; render(); };
  $("latestBtn").onclick = () => { weekIdx = defaultWeekIndex(); render(); };
  /* Jump to the last week of the chosen financial year that is not still ahead. Same move
     as clicking a bar, which is what keeps the rest of the page in step with the chart. */
  $("fySel").onchange = (e) => {
    const fy = +e.target.value;
    let idx = -1;
    DATA.weeks.forEach((w, i) => { if (fyOfWeek(w) === fy && !isAhead(w)) idx = i; });
    if (idx >= 0){ weekIdx = idx; render(); }
  };
  document.addEventListener("keydown", (e) => {
    if (["TEXTAREA", "SELECT", "INPUT"].includes(e.target.tagName)) return;
    if (e.key === "ArrowLeft"  && weekIdx > 0){ weekIdx--; render(); }
    if (e.key === "ArrowRight" && weekIdx < DATA.weeks.length - 1){ weekIdx++; render(); }
  });
}

boot();
</script>
